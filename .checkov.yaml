# Checks that are deliberately not applicable to this cluster. Everything not
# listed here is a finding we intend to fix, and the CI job fails on one.
skip-check:
  # Nodes need public IPs: there is no NAT gateway in this VPC, and the Talos
  # API and Kubernetes API are reached directly over the internet.
  - CKV_AWS_88
  # Flow logs, load balancer access logs and deletion protection are cost and
  # ceremony this cluster does not need.
  - CKV2_AWS_11
  - CKV_AWS_91
  - CKV_AWS_150
  # The OIDC bucket is deliberately world-readable, which is the only way an
  # OpenID Connect issuer works: AWS is an anonymous client of it. It holds
  # two documents, a public key and a description of where to find it, and
  # nothing else - ACLs are disabled entirely and the bucket policy grants
  # s3:GetObject on those two keys by name.
  - CKV_AWS_54
  - CKV_AWS_56
  - CKV2_AWS_6
  # Same bucket. Access logs of who read a public key, lifecycle rules for
  # two objects that are replaced rather than accumulated, cross-region
  # replication of a document rebuilt from the cluster on every apply, and
  # event notifications for writes Terraform makes - none of these buy
  # anything here. KMS is the same argument taken further: a key that has to
  # be decryptable by anonymous principals is not a key.
  - CKV_AWS_18
  - CKV_AWS_144
  - CKV_AWS_145
  - CKV2_AWS_61
  - CKV2_AWS_62
  # The internal security group is intentionally allow-all egress: it is the
  # group every node sits in, and Talos needs to reach the internet to pull
  # images.
  - CKV_AWS_382
  # Pinning is offered through the availability_zones variable. The data source
  # stays unfiltered so the default keeps working in any region; the check
  # cannot see the variable.
  - CKV_AWS_394
  # False positive across module boundaries: both groups are attached, by id,
  # through the compute module's launch templates.
  - CKV2_AWS_5
  # ELB health checks would let the autoscaling group terminate a control plane
  # node whose API server has not come up yet, which during a Talos bootstrap
  # is a death spiral. EC2 health checks are the safer default here.
  - CKV2_AWS_15
